title: SSH Successful Login (Base Event)
id: 9d2a6f1b-3e7c-4a8d-9f1e-5b3c8a2d6e4f
status: test
description: Detects a single successful SSH login. Used as the second half of a temporal correlation with failed-login events, to catch a brute force attack that eventually succeeded.
references:
  - https://attack.mitre.org/techniques/T1110/
author: Jiahao Liu
date: 2026-08-11
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  category: authentication
  product: linux
  service: auth
detection:
  selection:
    log_source: auth
    event.action: ssh_login
    event.outcome: success
  condition: selection
falsepositives:
  - Legitimate successful login
level: low
