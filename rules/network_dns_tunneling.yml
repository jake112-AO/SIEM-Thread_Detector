title: Suspicious DNS Query - Possible Tunneling
id: 3e7a9c1d-6f2b-4e8a-9c4d-8b1f6a2e9c7d
status: test
description: Detects DNS queries with unusually long subdomain labels, a common signature of DNS tunneling tools that encode data into query names to exfiltrate data or maintain covert command-and-control.
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: Jiahao Liu
date: 2026-08-11
tags:
  - attack.command_and_control
  - attack.exfiltration
  - attack.t1071.004
logsource:
  category: dns
  product: zeek
detection:
  selection:
    log_source: zeek
    event.action: dns_query
  filter:
    dns.question.subdomain_length|lt: 30
  condition: selection and not filter
falsepositives:
  - Legitimate services using long content-delivery or tracking subdomains (e.g. CDNs)
level: medium
