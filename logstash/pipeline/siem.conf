input {
  beats {
    port => 5044
  }
}

filter {
  # Normalize a timestamp field if present (adjust key name to match your generators)
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "UNIX"]
      target => "@timestamp"
    }
  }

  # Tag Zeek TSV logs for later parsing (Zeek logs are tab-separated with a
  # #fields header line — real column mapping gets added when you build the
  # Zeek ingestion task; for now this just keeps them separable in ES)
  if [log_source] == "zeek" {
    mutate {
      add_tag => ["zeek_raw"]
    }
  }

  # Custom auth-event Python scripts should emit JSON directly (ndjson input
  # above already parses these into top-level fields: user, src_ip, action,
  # result, etc.) — nothing extra needed here yet.

  mutate {
    add_field => { "pipeline" => "siem-week1" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "siem-%{log_source}-%{+YYYY.MM.dd}"
  }
  # Uncomment while debugging to see events hitting the pipeline:
  # stdout { codec => rubydebug }
}
