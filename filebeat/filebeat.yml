filebeat.inputs:
  - type: filestream
    id: cicids-logs
    enabled: true
    paths:
      - /var/log/siem/cicids/*.json
    parsers:
      - ndjson:
          keys_under_root: true
          add_error_key: true
          overwrite_keys: true
          expand_keys: true
    fields:
      log_source: "cicids"
    fields_under_root: true
output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /usr/share/filebeat/logs
  name: filebeat
  keepfiles: 7
